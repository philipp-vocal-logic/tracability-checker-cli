[[rules]]
files = ["src/**/*.py"]
forbid = [
    "^\\s*(from|import)\\s+(pytest|tests|subprocess|tokenize)\\b",
    "^\\s*from\\s+\\.",
]
fix = "Use absolute trace_check imports and keep src free of test, tokenize, or subprocess dependencies."

[[rules]]
files = ["src/trace_check/checker.py"]
max_lines = 400
forbid = [
    "^\\s*(from|import)\\s+trace_check\\.cli\\b",
    "^\\s*(from|import)\\s+(sys|argparse)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> checker. Keep CLI parsing and stdout/stderr printing out of checker.py."

[[rules]]
files = ["src/trace_check/model.py", "src/trace_check/source.py"]
max_lines = 200
forbid = [
    "^\\s*(from|import)\\s+trace_check\\.(cli|checker)\\b",
    "^\\s*(from|import)\\s+(sys|argparse|tomllib)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> checker -> source -> model. Keep model.py and source.py free of CLI, config loading, and printing."

[[rules]]
files = ["src/trace_check/cli.py"]
max_lines = 80
forbid = [
    "^\\s*(from|import)\\s+(re|ast|tomllib)\\b",
]
fix = "Keep cli.py as a thin entrypoint that delegates configuration loading and validation to checker.py."

[[rules]]
files = ["tests/**/*.py"]
max_lines = 550
fix = "Keep test modules concise and atomic."
